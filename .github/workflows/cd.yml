name: CD # Continuous Deployment

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  pull_request:
    paths:
      - '.github/workflows/cd.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package - ${{ matrix.platform.os-name }}
    runs-on: ${{ matrix.platform.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: macOS-x86_64
            runs-on: macOS-latest
            target: x86_64-apple-darwin
          - os-name: macOS-aarch64
            runs-on: macOS-latest
            target: aarch64-apple-darwin

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Install the pinned Rust toolchain and target
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        target: ${{ matrix.platform.target }}
        cache: false
        build-warnings: ''
    - name: Build binary
      uses: houseabsolute/actions-rust-cross@v1.0.8
      with:
        command: build
        target: ${{ matrix.platform.target }}
        args: "--locked --release"
        strip: true
    - name: Package artifacts
      uses: houseabsolute/actions-rust-release@v1.0.1
      with:
        executable-name: idig
        target: ${{ matrix.platform.target }}
        changes-file: CHANGELOG.md

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: houseabsolute/actions-rust-release/publish@v1.0.1
        with:
          executable-name: idig
          changes-file: CHANGELOG.md
